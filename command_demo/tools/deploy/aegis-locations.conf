# AEGIS 展台（挂在 blog.srlove.top 子路径下）
# 静态文件：宿主 /opt/1panel/www/aegis/（容器 /www/aegis/）
# API：Node 进程 127.0.0.1:8791

location = /aegis {
    return 301 /aegis/;
}

location = /aegis/ {
    root /www;
    try_files /aegis/cinematic.html =404;
}

location = /aegis/phone {
    root /www;
    try_files /aegis/mobile.html =404;
}

location = /aegis/tablet {
    root /www;
    try_files /aegis/tablet.html =404;
}

location /aegis/assets/ {
    root /www;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
}

location /aegis/ {
    root /www;
    try_files $uri =404;
}

location /api/ {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
    add_header X-Accel-Buffering no;
}
