<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f3f0" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="AEGIS 移动端 · 现场预警与拍照上报" />
  <title>AEGIS 校园中枢</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./src/mobile/min.css" />
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <symbol id="ic-shield" viewBox="0 0 24 24">
        <path d="M12 3.2 19.2 6v5.2c0 4.3-3 7.5-7.2 9.4-4.2-1.9-7.2-5.1-7.2-9.4V6L12 3.2Z" />
        <path d="m9 12 2.2 2.2L15.4 10" />
      </symbol>
      <symbol id="ic-bell" viewBox="0 0 24 24">
        <path d="M18 15.5V10a6 6 0 1 0-12 0v5.5L4.4 18h15.2L18 15.5Z" />
        <path d="M9.8 21a2.4 2.4 0 0 0 4.4 0" />
      </symbol>
      <symbol id="ic-camera" viewBox="0 0 24 24">
        <path d="M4 8.6h3.1l1.3-2h7.2l1.3 2H20v10.5H4V8.6Z" />
        <circle cx="12" cy="13.6" r="3.4" />
      </symbol>
      <symbol id="ic-image" viewBox="0 0 24 24">
        <rect x="3.6" y="5" width="16.8" height="14" rx="2.4" />
        <path d="m6.4 16 3.6-3.8 2.6 2.6 2.2-2.2 3 3.4" />
        <circle cx="9.2" cy="9.6" r="1.2" />
      </symbol>
      <symbol id="ic-arrow" viewBox="0 0 24 24">
        <path d="M5 12h13m-5.5-5.5L18 12l-5.5 5.5" />
      </symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="top">
      <div class="brand">
        AEGIS
        <small>校园中枢</small>
      </div>
      <div class="conn" id="conn" data-mode="connecting">
        <i></i><span id="conn-text">连接中</span>
      </div>
    </header>

    <!-- ── 一、现场预警 ───────────────────────────────────────────── -->
    <section class="screen is-on" id="screen-alerts">
      <p class="kicker">实时预警</p>
      <h1>现场态势</h1>

      <!-- 展台上最重要的一条动作：让路过的人知道手机能干什么 -->
      <button class="join-cta" type="button" id="join-cta">
        <span class="jc-k">观众参与 · 30 秒</span>
        <span class="jc-t">拍一张现场照片<br />让四个模型一起看</span>
        <span class="jc-a">上报 <i>→</i></span>
      </button>

      <div class="stats">
        <div><b class="num" id="n-active">0</b><span>待派单</span></div>
        <div><b class="num" id="n-handling">0</b><span>处置中</span></div>
        <div><b class="num" id="n-resolved">0</b><span>今日已处置</span></div>
      </div>

      <div class="scene-line">
        <span id="scene-name">校园 · 校园巡检模型</span>
        <span class="num" id="scene-time">—</span>
      </div>

      <div class="sec-head">
        <b>事件流</b>
        <span id="list-hint">等待第一条预警</span>
      </div>

      <div class="list" id="list">
        <div class="skel"></div>
        <div class="skel"></div>
      </div>
    </section>

    <!-- ── 二、拍照上报 ───────────────────────────────────────────── -->
    <section class="screen" id="screen-report">
      <p class="kicker">观众参与</p>
      <h1>上报一次异常</h1>
      <p class="sub">拍一张现场照片，四个场景模型一起看，结果直接送到指挥大屏。</p>

      <div class="step">
        <div class="step-h"><i>1</i>选场景</div>
        <div class="seg" id="seg-scene">
          <button type="button" data-scene="campus" class="is-on">校园</button>
          <button type="button" data-scene="community">小区</button>
          <button type="button" data-scene="subway">地铁</button>
          <button type="button" data-scene="forest">森林</button>
        </div>
      </div>

      <div class="step">
        <div class="step-h"><i>2</i>拍一张照片</div>
        <div class="shot" id="shot">
          <div class="shot-empty" id="shot-empty">
            <svg class="ic" aria-hidden="true"><use href="#ic-image"></use></svg>
            <div>还没有照片</div>
          </div>
          <img id="shot-img" alt="" hidden />
          <div class="shot-cap" id="shot-cap" hidden></div>
        </div>
        <div class="shot-row">
          <button class="btn" type="button" id="btn-camera">
            <svg class="ic" aria-hidden="true"><use href="#ic-camera"></use></svg>拍照
          </button>
          <button class="btn" type="button" id="btn-demo">
            <svg class="ic" aria-hidden="true"><use href="#ic-image"></use></svg>用演示照片
          </button>
        </div>
        <p class="hint" id="photo-hint">照片只在本机预览，不会上传。</p>
      </div>

      <div class="step">
        <div class="step-h"><i>3</i>让四个模型看一眼</div>
        <div class="verdict" id="verdict" hidden>
          <h3><b id="verdict-title">—</b><span id="verdict-model"></span></h3>
          <dl id="verdict-rows"></dl>
        </div>
        <button class="btn primary" type="button" id="btn-send" disabled>先拍一张照片</button>
      </div>
    </section>
  </div>

  <nav class="tabbar" id="tabbar">
    <button type="button" class="is-on" data-screen="alerts">
      <svg class="ic" aria-hidden="true"><use href="#ic-bell"></use></svg>
      预警
      <span class="badge" id="unread" hidden>0</span>
    </button>
    <button type="button" data-screen="report">
      <svg class="ic" aria-hidden="true"><use href="#ic-camera"></use></svg>
      上报
    </button>
  </nav>

  <!-- ── 预警详情 ─────────────────────────────────────────────────── -->
  <div class="sheet" id="sheet">
    <div class="sheet-bg" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="grip"></div>
      <h2 id="sheet-title">—</h2>
      <figure class="photo" id="sheet-photo">
        <img id="sheet-img" alt="" hidden />
        <div class="shot-empty" id="sheet-photo-empty">
          <svg class="ic" aria-hidden="true"><use href="#ic-image"></use></svg>
          <div>现场照片位</div>
        </div>
        <figcaption class="cap" id="sheet-cap" hidden></figcaption>
      </figure>
      <dl class="rows" id="sheet-rows"></dl>
      <div class="phases" id="sheet-phases"></div>
      <button class="close" type="button" data-close>关闭</button>
    </div>
  </div>

  <input type="file" id="file" accept="image/*" capture="environment" hidden />
  <div class="toast" id="toast"></div>

  <script type="module" src="./src/mobile/min.js"></script>
</body>
</html>
