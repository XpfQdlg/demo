<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>校园中枢 · 观感版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e12; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }

  #hud {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #cfd8e3; font: 15px/1.6 "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .08em;
  }
  #hud .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(150, 200, 255, .22);
    border-top-color: #7fb4ff;
    animation: spin 900ms linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #tip {
    position: fixed; left: 24px; bottom: 16px;
    color: rgba(210, 224, 240, .5);
    font: 12px/1.7 "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .06em; opacity: 0; transition: opacity .8s ease .4s;
    pointer-events: none;
  }
  #tip b { color: rgba(160, 200, 245, .8); font-weight: 500; }

  /* ── 顶栏 ────────────────────────────────────────────────────────
     一条通栏：左品牌、中场景、右运行状态。
     之前把页签和画质分别挂在顶部两角，没有整体感，像调试页。 */
  #topbar {
    position: fixed; left: 0; right: 0; top: 0; height: 56px; z-index: 10;
    display: flex; align-items: center; gap: 20px;
    padding: 0 24px;
    background: rgba(8, 13, 19, .86);
    border-bottom: 1px solid rgba(120, 170, 255, .10);
    backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px -16px rgba(0, 0, 0, .9);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    position: relative; width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(140deg, #5aa2ff, #1f5fd0);
    box-shadow: 0 0 16px rgba(63, 140, 255, .45), inset 0 1px 0 rgba(255, 255, 255, .4);
  }
  .brand .mark::after {
    content: ""; position: absolute; inset: 6px;
    border: 1.5px solid rgba(255, 255, 255, .9); border-radius: 2px;
    border-right-color: transparent; border-bottom-color: transparent;
    transform: rotate(45deg);
  }
  .brand-txt { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-txt b { font-size: 14px; font-weight: 600; letter-spacing: .08em; color: #e9f2fc; }
  .brand-txt span { font-size: 10px; letter-spacing: .14em; color: rgba(150, 180, 215, .5); }

  #tabs {
    display: flex; gap: 2px; padding: 3px;
    background: rgba(120, 170, 255, .06);
    border: 1px solid rgba(120, 170, 255, .10);
    border-radius: 9px;
  }
  .tab {
    padding: 6px 16px; border: 0; border-radius: 7px; cursor: pointer;
    background: transparent; color: rgba(190, 208, 228, .6);
    font: 12px/1 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .1em; transition: background .18s, color .18s;
  }
  .tab:hover { color: #dbe8f7; background: rgba(120, 170, 255, .08); }
  .tab.on {
    background: rgba(63, 140, 255, .22); color: #eaf3ff;
    box-shadow: inset 0 0 0 1px rgba(63, 140, 255, .38);
  }

  /* 指挥中心的三个即时指标。数字用等宽，跳变时不左右晃。 */
  .stats { display: flex; align-items: center; }
  .stat {
    display: flex; flex-direction: column; gap: 3px;
    padding: 0 16px; border-left: 1px solid rgba(120, 170, 255, .10);
  }
  .stat:first-child { border-left: 0; padding-left: 4px; }
  .stat span { font-size: 10px; letter-spacing: .12em; color: rgba(150, 180, 215, .48); }
  .stat b {
    font: 13px/1 ui-monospace, Consolas, monospace; font-weight: 500;
    color: #dbe8f7; font-variant-numeric: tabular-nums;
  }

  .topright { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .live {
    display: flex; align-items: center; gap: 6px;
    font: 11px/1 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .1em; color: rgba(150, 220, 180, .78);
  }
  .live i {
    width: 6px; height: 6px; border-radius: 50%; background: #3ecf8e;
    box-shadow: 0 0 8px rgba(62, 207, 142, .9);
    animation: livepulse 2.4s ease-in-out infinite;
  }
  @keyframes livepulse { 50% { opacity: .3; } }

  #fps {
    font: 11px/1 ui-monospace, Consolas, monospace;
    color: rgba(150, 180, 215, .55); min-width: 52px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #quality {
    display: flex; gap: 2px; padding: 3px;
    background: rgba(120, 170, 255, .06);
    border: 1px solid rgba(120, 170, 255, .10);
    border-radius: 9px;
  }
  .q {
    padding: 5px 11px; border: 0; border-radius: 7px; cursor: pointer;
    background: transparent; color: rgba(190, 208, 228, .56);
    font: 12px/1 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    transition: background .18s, color .18s;
  }
  .q:hover { color: #dbe8f7; background: rgba(120, 170, 255, .08); }
  .q.on { background: rgba(63, 140, 255, .22); color: #eaf3ff; }

  /* 右上角小窗：第一人称机器视角。主画面是第三人称跟随，这里补上「机器自己看到什么」 */
  #pipbox {
    position: fixed; right: 24px; top: 64px; width: 336px;
    background: rgba(10, 16, 24, .6);
    border: 1px solid rgba(140, 180, 220, .28);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
    backdrop-filter: blur(6px);
    display: none; z-index: 9;
  }
  #pipbox.on { display: block; }
  #pip { display: block; width: 100%; height: 189px; }
  /* 第一视角的检测框层：盖在小窗画面上，不拦鼠标 */
  #pipmarks {
    position: absolute; left: 0; top: 0; width: 100%; height: 189px;
    pointer-events: none; overflow: hidden;
  }
  .pip-mark {
    position: absolute; display: none;
    border: 1px solid rgba(120, 226, 255, .9);
    border-radius: 2px;
    box-shadow: inset 0 0 12px rgba(80, 200, 255, .22);
  }
  .pip-mark i {
    position: absolute; left: -1px; bottom: 100%; margin-bottom: 3px;
    padding: 1px 5px; border-radius: 3px;
    background: rgba(8, 30, 44, .82);
    border: 1px solid rgba(120, 226, 255, .45);
    color: #d8f4ff; font: 10px/1.5 "Microsoft YaHei", system-ui, sans-serif;
    font-style: normal; letter-spacing: .04em; white-space: nowrap;
  }
  .pip-mark.alarm { border-color: rgba(255, 130, 100, .95); box-shadow: inset 0 0 12px rgba(255, 110, 80, .28); }
  .pip-mark.alarm i { background: rgba(58, 18, 14, .85); border-color: rgba(255, 140, 110, .55); color: #ffd9c2; }
  #pipbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px;
    font: 11px/1 "Microsoft YaHei", system-ui, sans-serif;
    color: rgba(190, 214, 240, .7); letter-spacing: .05em;
  }
  #pipbar b { color: #d9ecff; font-weight: 500; }

  /* 发现播报：跟随视角下用消息条，全局视角用头顶气泡 */
  #toast {
    position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%) translateY(10px);
    padding: 10px 18px 10px 14px; border-radius: 10px;
    background: linear-gradient(180deg, rgba(20, 26, 34, .94), rgba(11, 16, 22, .96));
    border: 1px solid rgba(120, 170, 255, .18);
    border-left: 3px solid var(--primary);
    color: #dbe8f7;
    box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .95);
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .04em; white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 12;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  #tip .credit {
    margin-left: 14px; padding-left: 14px;
    border-left: 1px solid rgba(120, 170, 255, .14);
    color: rgba(150, 175, 205, .3); letter-spacing: .04em;
  }

  /* 图标：线稿，尺寸和描边统一 */
  #icons { position: absolute; width: 0; height: 0; overflow: hidden; }
  .ico {
    width: 16px; height: 16px; flex: none;
    fill: none; stroke: currentColor; stroke-width: 1.4;
    stroke-linecap: round; stroke-linejoin: round;
    display: block;
  }

  /* ── 设计令牌 ──────────────────────────────────────────────────
     一处定义，后面都用变量。主色蓝、警示红，语义色只用在状态上，
     不拿主色到处刷——刷满了就没有主色了。 */
  :root {
    --panel: rgba(10, 16, 24, .62);
    --line: rgba(120, 160, 220, .14);
    --line-soft: rgba(120, 160, 220, .08);
    --text: rgba(214, 226, 240, .92);
    --muted: rgba(170, 192, 216, .55);
    --primary: #3f8cff;
    --danger: #ff5b52;
    --warn: #f0a93c;
    --ok: #3ecf8e;
  }

  /* ── 两块面板 ──────────────────────────────────────────────────
     间距一律 24 / 16 / 8，内边距 12，圆角 12。
     之前每块面板各写一套，摆在一起就散。 */
  #agents, #feed {
    position: fixed; z-index: 9;
    padding: 12px 12px 10px;
    background: linear-gradient(180deg, rgba(16, 24, 34, .80), rgba(9, 14, 20, .86));
    border: 1px solid rgba(120, 170, 255, .12);
    border-radius: 14px; backdrop-filter: blur(14px);
    box-shadow:
      0 18px 40px -18px rgba(0, 0, 0, .9),
      inset 0 1px 0 rgba(255, 255, 255, .05);
    font: 12px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
  }
  #agents { left: 24px; top: 72px; width: 220px; }
  #feed { right: 24px; bottom: 40px; width: 392px; }
  .panel-h {
    display: flex; align-items: center; gap: 8px;
    padding: 0 2px 10px; margin-bottom: 8px;
    border-bottom: 1px solid rgba(120, 170, 255, .08);
    font-size: 11px; letter-spacing: .14em; color: rgba(170, 195, 225, .78);
  }
  .panel-h .ph-dot {
    width: 3px; height: 12px; border-radius: 2px;
    background: linear-gradient(180deg, #7bb6ff, #3f8cff);
    box-shadow: 0 0 8px rgba(63, 140, 255, .65);
  }
  .panel-h b {
    margin-left: auto; font: 11px/1 ui-monospace, Consolas, monospace;
    font-weight: 500; color: rgba(170, 195, 225, .45);
    font-variant-numeric: tabular-nums;
  }

  /* 执行体：圆点 + 名字 + 状态胶囊。出警时行底部一条进度。 */
  .agent-row {
    position: relative;
    display: grid; grid-template-columns: 16px 16px 1fr auto; align-items: center; gap: 7px;
    width: 100%;
    padding: 8px; margin-bottom: 2px; border: 0; border-radius: 8px;
    background: transparent; color: inherit;
    font: inherit; text-align: left; cursor: pointer;
    transition: background .16s;
  }
  .agent-row::before {
    content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px;
    border-radius: 2px; background: transparent; transition: background .18s;
  }
  .agent-row.on::before { background: var(--primary); box-shadow: 0 0 10px rgba(63, 140, 255, .8); }
  .agent-row:hover { background: rgba(63, 140, 255, .10); }
  .agent-row.on { background: rgba(63, 140, 255, .18); }
  .agent-row .idx {
    font: 10px/1 ui-monospace, Consolas, monospace;
    color: rgba(150, 180, 215, .42); text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .agent-row .name { letter-spacing: .04em; }
  .agent-row .ico { color: rgba(150, 185, 225, .55); }
  .agent-row[data-state="moving"] .ico { color: var(--warn); }
  .agent-row[data-state="on_site"] .ico,
  .agent-row[data-state="busy"] .ico { color: var(--danger); }
  .agent-row.on .ico { color: #9cc4ff; }
  .agent-row .pill {
    padding: 1px 8px; border-radius: 999px;
    font-size: 11px; line-height: 1.6; white-space: nowrap;
    color: rgba(190, 210, 235, .8);
    background: rgba(120, 160, 220, .12);
    border: 1px solid rgba(120, 160, 220, .18);
    transition: color .2s, background .2s, border-color .2s;
  }
  .agent-row[data-state="moving"] .idx { color: var(--warn); }
  .agent-row[data-state="moving"] .pill {
    color: #ffdca8; background: rgba(240, 169, 60, .16); border-color: rgba(240, 169, 60, .38);
  }
  .agent-row[data-state="on_site"] .idx,
  .agent-row[data-state="busy"] .idx { color: var(--danger); }
  .agent-row[data-state="on_site"] .pill,
  .agent-row[data-state="busy"] .pill {
    color: #ffc7c2; background: rgba(255, 91, 82, .16); border-color: rgba(255, 91, 82, .4);
  }
  .agent-row .prog {
    position: absolute; left: 8px; bottom: 2px; height: 2px; width: 0;
    border-radius: 2px; background: var(--warn); opacity: .8;
    transition: width .3s linear;
  }

  /* 事件流：卡片 + 左侧等级色条 + 等宽时间。新来的高亮两秒。 */
  #feedRows { display: flex; flex-direction: column; gap: 6px; }
  .feed-empty {
    padding: 16px 10px; text-align: center;
    font-size: 11px; letter-spacing: .12em; color: rgba(150, 175, 205, .32);
  }
  .feed-row {
    display: grid; grid-template-columns: 3px 16px 1fr auto; gap: 9px; align-items: start;
    padding: 8px 10px 8px 8px; border-radius: 8px;
    background: rgba(120, 160, 220, .045);
    border: 1px solid var(--line-soft);
    transition: background .35s ease, border-color .35s ease;
  }
  .feed-row .bar {
    width: 3px; align-self: stretch; border-radius: 2px;
    background: rgba(120, 160, 220, .35);
  }
  .feed-row.info .bar { background: var(--primary); }
  .feed-row.warn .bar { background: var(--warn); }
  .feed-row.alarm .bar { background: var(--danger); }
  .feed-row.ok .bar { background: var(--ok); }
  .feed-row .ico { margin-top: 1px; color: rgba(150, 185, 225, .7); }
  .feed-row.warn .ico { color: var(--warn); }
  .feed-row.alarm .ico { color: var(--danger); }
  .feed-row.ok .ico { color: var(--ok); }
  .feed-row.info .ico { color: var(--primary); }
  .feed-row .msg { line-height: 1.45; color: var(--text); }
  .feed-row .t {
    font: 11px/1.6 ui-monospace, Consolas, monospace;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .feed-row.warn .msg { color: #ffe0b4; }
  .feed-row.alarm .msg { color: #ffc2bc; }
  .feed-row.ok .msg { color: #b7f0d4; }
  .feed-row.fresh { background: rgba(63, 140, 255, .16); border-color: rgba(63, 140, 255, .4); }

  /* 扫描建图面板：跟随设备时出现，显示当前扫描半径与重建进度。
     和左侧执行体列表同一套底，位置放在它下面，跟随状态下一起读。 */
  #scanHud {
    position: fixed; left: 24px; bottom: 72px; width: 220px; z-index: 9;
    padding: 8px 10px 9px;
    background: rgba(10, 16, 24, .55);
    border: 1px solid rgba(140, 180, 220, .16);
    border-radius: 10px; backdrop-filter: blur(8px);
    font: 12px/1.5 "Microsoft YaHei", system-ui, sans-serif;
    color: rgba(200, 216, 232, .72);
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  #scanHud.on { opacity: 1; transform: translateY(0); }
  .sh-row { display: flex; align-items: center; gap: 7px; }
  .sh-row b { font-weight: 500; color: #d9ecff; letter-spacing: .06em; }
  .sh-dot {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: #43e0ff; box-shadow: 0 0 8px rgba(67, 224, 255, .9);
    animation: shpulse 1.1s ease-in-out infinite;
  }
  @keyframes shpulse { 50% { opacity: .35; } }
  .sh-tag {
    margin-left: auto; padding: 1px 6px; border-radius: 4px;
    font-size: 10px; letter-spacing: .08em;
    color: rgba(150, 220, 255, .85);
    background: rgba(67, 224, 255, .12);
    border: 1px solid rgba(67, 224, 255, .3);
  }
  .sh-bar {
    height: 3px; margin: 8px 0 6px; border-radius: 2px;
    background: rgba(140, 180, 220, .16); overflow: hidden;
  }
  .sh-bar i {
    display: block; height: 100%; width: 0; border-radius: 2px;
    background: linear-gradient(90deg, #2b8fd6, #6fe3ff);
    box-shadow: 0 0 8px rgba(67, 224, 255, .55);
    transition: width .2s linear;
  }
  .sh-meta {
    display: flex; justify-content: space-between;
    font: 11px/1 ui-monospace, Consolas, monospace;
    color: rgba(160, 200, 245, .62);
  }

  /* H 键：把面板收起来，只剩画面，接大屏时用 */
  body.clean #agents, body.clean #feed, body.clean #tip, body.clean #scanHud { display: none; }
</style>
</head>
<body>
  <!-- 图标库：16 格线稿，统一 1.4 描边，颜色跟 currentColor 走 -->
  <svg id="icons" aria-hidden="true" focusable="false">
    <symbol id="ico-dog" viewBox="0 0 16 16">
      <rect x="3.2" y="6.4" width="6.2" height="3.4" rx="1.1"/>
      <path d="M9.4 6.2h3.1v3.6H9.4z"/>
      <path d="M10.1 6.2 10.7 4.4 11.7 6"/>
      <path d="M4.6 9.8v3.6M7.6 9.8v3.6M10.4 9.8v3.6"/>
      <path d="M3.2 7.2 1.8 5.6"/>
    </symbol>
    <symbol id="ico-person" viewBox="0 0 16 16">
      <circle cx="8" cy="4.8" r="2.2"/>
      <path d="M3.6 14c0-2.5 2-4.4 4.4-4.4s4.4 1.9 4.4 4.4"/>
    </symbol>
    <symbol id="ico-fire" viewBox="0 0 16 16">
      <path d="M8 2.2c2.5 2.9 3.8 4.6 3.8 6.7a3.8 3.8 0 0 1-7.6 0c0-1.6.7-2.7 1.7-3.8.2 1.1.6 1.8 1.1 1.9.6-.9.8-2.5 1-4.8z"/>
    </symbol>
    <symbol id="ico-trash" viewBox="0 0 16 16">
      <path d="M3.4 5.2h9.2"/>
      <path d="M6.4 5.2V3.9c0-.5.4-.9.9-.9h1.4c.5 0 .9.4.9.9v1.3"/>
      <path d="M4.8 5.2 5.4 13c0 .4.3.7.7.7h3.8c.4 0 .7-.3.7-.7l.6-7.8"/>
      <path d="M6.9 7.6v3.8M9.1 7.6v3.8"/>
    </symbol>
    <symbol id="ico-crowd" viewBox="0 0 16 16">
      <circle cx="8" cy="4.6" r="1.9"/>
      <circle cx="3.4" cy="6.2" r="1.5"/>
      <circle cx="12.6" cy="6.2" r="1.5"/>
      <path d="M4.4 13.6c0-2 1.6-3.6 3.6-3.6s3.6 1.6 3.6 3.6"/>
      <path d="M1.4 13.6c0-1.3.8-2.4 2-2.8M14.6 13.6c0-1.3-.8-2.4-2-2.8"/>
    </symbol>
    <symbol id="ico-radar" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="1.2"/>
      <path d="M8 8 12.4 4.6"/>
      <path d="M5.2 10.8a4 4 0 0 1 5.6-5.6"/>
      <path d="M2.8 13.2a7 7 0 0 1 9.9-9.9"/>
    </symbol>
    <symbol id="ico-target" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="4.6"/>
      <circle cx="8" cy="8" r="1.2"/>
    </symbol>
  </svg>
  <div id="stage"></div>
  <div id="hud"><div><div class="ring"></div>正在载入环境光…</div></div>
  <header id="topbar">
    <div class="brand">
      <span class="mark"></span>
      <div class="brand-txt"><b>校园中枢</b><span>视觉巡检 · 演示版</span></div>
    </div>

    <nav id="tabs">
      <button class="tab on" data-scene="campus" type="button">校园</button>
      <button class="tab" data-scene="community" type="button">小区</button>
      <button class="tab" data-scene="forest" type="button">森林</button>
      <button class="tab" data-scene="subway" type="button">地铁</button>
    </nav>

    <div class="stats">
      <div class="stat"><span>在线设备</span><b id="kpiOnline">—</b></div>
      <div class="stat"><span>今日报警</span><b id="kpiAlarm">0</b></div>
      <div class="stat"><span>平均响应</span><b id="kpiResp">—</b></div>
    </div>

    <div class="topright">
      <span class="live"><i></i>运行中</span>
      <span id="fps">— fps</span>
      <div id="quality">
        <button class="q" data-q="low" type="button">低</button>
        <button class="q" data-q="medium" type="button">中</button>
        <button class="q" data-q="high" type="button">高</button>
        <button class="q" id="reset" type="button" title="重置视角（或按 R）">⟳</button>
      </div>
    </div>
  </header>
  <div id="pipbox">
